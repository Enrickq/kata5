# NGINX >= 1.27.3. No se reescribe este archivo al detener o añadir réplicas.
# service=<name> consulta por DNS SRV a Consul: _<name>._tcp.service.consul
upstream fibonacci_pool {
    zone fibonacci_pool 64k;
    resolver consul:8600 valid=2s ipv6=off;
    resolver_timeout 2s;
    server service.consul service=fibonacci resolve;
}

upstream primes_pool {
    zone primes_pool 64k;
    resolver consul:8600 valid=2s ipv6=off;
    resolver_timeout 2s;
    server service.consul service=primes resolve;
}

server {
    listen 80;
    server_tokens off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","component":"nginx"}';
    }

    location = /api/v1/fibonacci {
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://fibonacci_pool;
        add_header X-Upstream-Address $upstream_addr always;
    }

    location = /api/v1/primes {
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://primes_pool;
        add_header X-Upstream-Address $upstream_addr always;
    }

    location / { return 404; }
}
